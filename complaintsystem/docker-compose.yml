version: "3.8"
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ise123
      MYSQL_DATABASE: complaintdb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - complaint-net

  complaintsystem:
    build: .
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    networks:
      - complaint-net

volumes:
  mysql_data:

networks:
  complaint-net:
    driver: bridge
